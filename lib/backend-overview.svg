<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 164" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>后道封测总览</title>
  <desc>中央封装叠层承载测试波形，四条线路连接产能规划、制程工程、质量与厂务支持。</desc>
  <defs>
    <linearGradient id="top" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#8ce3be"/><stop offset=".55" stop-color="#49bb96"/><stop offset="1" stop-color="#248872"/>
    </linearGradient>
    <linearGradient id="substrate" x2="1" y2="1">
      <stop stop-color="#396861"/><stop offset="1" stop-color="#173e39"/>
    </linearGradient>
  </defs>

  <!-- Four function terminals route into a shared test and assembly platform. -->
  <g stroke="#699589" stroke-width="1.6">
    <path d="M73 41h28l27 16h28 M67 119h28l34-21h14 M269 45h-28l-26 15h-28 M274 118h-29l-29-18h-17"/>
    <path d="M91 47h8l19 11m124 53h7" opacity=".5"/>
  </g>
  <g fill="#e4f2e9" stroke="#628d80" stroke-width="1.3">
    <rect x="47" y="28" width="26" height="26" rx="8"/>
    <rect x="41" y="106" width="26" height="26" rx="8"/>
    <rect x="269" y="32" width="26" height="26" rx="8"/>
    <rect x="274" y="105" width="26" height="26" rx="8"/>
  </g>
  <g stroke="#2e6159" stroke-width="1.6">
    <path d="M54 47h12m-10-3v-4m4 4v-8m4 8v-6"/>
    <path d="M48 115h12m-12 7h12"/><rect x="51" y="112.8" width="2.8" height="4.4" rx="1" fill="#d3eade"/><rect x="55" y="119.8" width="2.8" height="4.4" rx="1" fill="#d3eade"/>
    <path d="m282 38 6 2v4q0 4-6 7-6-3-6-7v-4zm-2.6 6 1.9 1.9 3.6-4"/>
    <path d="M280 124v-10l4 2v-4l5 3v-5h3v14zm3-4h1m3 0h1"/>
  </g>

  <!-- Substrate, contact pads and two exposed layers in the same projection. -->
  <path d="m110 101 60-29 60 29v6l-60 30-60-30z" fill="#17453e"/>
  <path d="m110 101 60-30 60 30-60 30z" fill="url(#substrate)" stroke="#538878"/>
  <g fill="#c5d7a3">
    <path d="m120 102 4-2 4 2-4 2zm9 4.5 4-2 4 2-4 2zm9 4.5 4-2 4 2-4 2zm9 4.5 4-2 4 2-4 2zm9 4.5 4-2 4 2-4 2z"/>
    <path d="m184 120 4-2 4 2-4 2zm9-4.5 4-2 4 2-4 2zm9-4.5 4-2 4 2-4 2zm9-4.5 4-2 4 2-4 2z"/>
  </g>
  <path d="m121 87 49-24 49 24v7l-49 25-49-25z" fill="#3b7669"/>
  <path d="m121 87 49-24 49 24-49 25z" fill="#a7d5bf" stroke="#6da992"/>
  <path d="m128 69 42-21 42 21v10l-42 21-42-21z" fill="#23695a"/>
  <path d="m170 90 42-21v10l-42 21z" fill="#20564c"/>
  <path d="m128 69 42-21 42 21-42 21z" fill="#d6f6de" stroke="#86bc9f"/>
  <path d="m134 66 36-18 36 18v4l-36 18-36-18z" fill="#348d73"/>
  <path d="m134 66 36-18 36 18-36 18z" fill="url(#top)" stroke="#b5edd1"/>
  <path d="m149 67 8 4 4-2 1-8 4 13 5-10 4 2 12-6" stroke="#165349" stroke-width="2.4"/>
</svg>
